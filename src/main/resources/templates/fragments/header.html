<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
	<header th:fragment="header" class="topbar">
		<div class="brand">
			<a th:href="@{/}">IOTSTAR SHOP</a>
		</div>
		<div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
			<img class="avatar"
				th:src="${#authentication.principal.images != null
					and !#strings.isEmpty(#authentication.principal.images)
					? #authentication.principal.images
					: '/images/avatar-default.png'}"
				alt="Avatar">
			<div>
				<strong th:text="${#authentication.principal.fullName}">Nguyễn Văn A</strong>
				<span th:text="'(' + ${#authentication.principal.username} + ')'">(nguyenvana)</span>
				<div class="muted" th:text="${#authentication.principal.email}">email@gmail.com</div>
			</div>
			<span class="badge" th:text="${#authentication.principal.role}">ROLE_USER</span>
			<form th:action="@{/logout}" method="post" style="display: inline">
				<button class="link-button" type="submit">Đăng xuất</button>
			</form>
		</div>
		<div class="account" th:unless="${#authorization.expression('isAuthenticated()')}">
			<a class="link-button" th:href="@{/login}">Đăng nhập</a>
		</div>
	</header>
</body>
</html>
