<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<header th:fragment="header" class="topbar">
    <div class="brand">
        <a th:href="@{/}">
            IOTSTAR SHOP
        </a>
    </div>

    <nav>

        <a th:href="@{/}">
            Dashboard
        </a>

        <a
                th:if="${#authorization.expression('isAuthenticated()')}"
                th:href="@{/products}">
            Products
        </a>

        <a
                th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                th:href="@{/users}">
            Users
        </a>

    </nav>
    <div
            class="account"
            th:if="${#authorization.expression('isAuthenticated()')}">
        <img
                class="avatar"
                th:if="${#authentication.principal.images != null
                    and !#strings.isEmpty(
                        #authentication.principal.images
                    )}"
                th:src="${#strings.substringBefore(
                    #authentication.principal.images,
                    '|'
                )}"
                alt="avatar">

        <div>

            <div
                    th:text="${#authentication.name}">
                admin
            </div>

            <span class="muted">

                <span
                        th:if="${#authorization.expression(
                            'hasRole(''ADMIN'')'
                        )}">
                    ROLE_ADMIN
                </span>

                <span
                        th:unless="${#authorization.expression(
                            'hasRole(''ADMIN'')'
                        )}">
                    ROLE_USER
                </span>

            </span>

        </div>
        <form
                th:action="@{/logout}"
                method="post">

            <button
                    type="submit"
                    class="link-button">

                Logout

            </button>

        </form>

    </div>
    <div
            th:unless="${#authorization.expression('isAuthenticated()')}">

        <a th:href="@{/login}">
            Login
        </a>

    </div>

</header>

</body>
</html>
