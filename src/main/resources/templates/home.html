<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Dashboard')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
    <main>
        <div class="page-title">
            <div>
                <span class="eyebrow">IOTSTAR SHOP</span>
                <h1>Dashboard</h1>
                <p class="page-subtitle">Tổng quan nhanh về dữ liệu cửa hàng.</p>
            </div>
        </div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div class="cards">
            <div class="card"><b>Total Users</b><strong th:text="${userCount}">0</strong></div>
            <div class="card"><b>Total Products</b><strong th:text="${productCount}">0</strong></div>
        </div>
        <div class="quick-links mt">
            <a class="btn primary" th:href="@{/products}">Quản lý Products</a>
            <a class="btn secondary" th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/users}">Quản lý Users</a>
        </div>
    </main>
</div>
</body>
</html>
